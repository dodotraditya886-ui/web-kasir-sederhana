:root{--red:#e60012;--dred:#8a0010;--blk:#0b0b0b;--wht:#fff;--gry:#ddd;--surf:#161616;--txt:#fff;--bounce:cubic-bezier(.34,1.8,.5,1)}
@media (prefers-color-scheme:light){:root{}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--blk);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
 background-image:repeating-linear-gradient(-45deg,#0b0b0b 0 14px,#140000 14px 28px)}
.p5{font-family:"P5","Impact",sans-serif;letter-spacing:.04em;font-weight:normal}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,select{font:inherit}

/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--red);
 clip-path:polygon(0 0,100% 0,100% 70%,97% 100%,0 85%);position:relative;z-index:5;min-height:70px}
header h1{font-size:clamp(1.5rem,4vw,2.6rem);transform:rotate(-3deg);background:var(--blk);padding:0 14px;color:var(--wht);animation:pop .6s var(--bounce)}
header h1 span{color:var(--red)}
nav{margin-left:auto;display:flex;gap:8px}
.tab{font-family:"P5";font-size:1.3rem;padding:6px 18px;background:var(--wht);color:var(--blk);transform:skew(-12deg);transition:.25s var(--bounce)}
.tab:hover{transform:skew(-12deg) scale(1.12) rotate(-2deg);background:var(--blk);color:var(--wht)}
.tab.on{background:var(--blk);color:var(--wht);box-shadow:4px 4px 0 var(--wht)}
.view{display:none;flex:1;min-height:0;padding:14px;animation:slide .45s var(--bounce)}
.view.on{display:flex;gap:14px}
@keyframes pop{from{transform:scale(0) rotate(20deg)}to{transform:scale(1) rotate(-3deg)}}
@keyframes slide{from{opacity:0;transform:translateX(-40px) skewX(8deg)}to{opacity:1;transform:none}}

/* ===== PANEL (efek kertas robek) ===== */
.panel{background:var(--wht);color:var(--blk);padding:14px 16px 22px;display:flex;flex-direction:column;min-height:0;
 clip-path:polygon(0 2%,6% 0,14% 2%,25% 0,38% 2%,52% 0,66% 2%,80% 0,92% 2%,100% 0,100% 98%,90% 100%,75% 98%,58% 100%,40% 98%,22% 100%,8% 98%,0 100%);
 box-shadow:0 0 0 4px var(--red)}
.panel.dark{background:var(--wht);color:#000} /* panel daftar admin: latar putih agar teks hitam terbaca */
.panel h2{font-family:"P5";font-size:1.7rem;color:var(--red);transform:rotate(-1.5deg);margin-bottom:8px}

/* ===== KASIR ===== */
#products{flex:1.6}
#cartP{flex:1;min-width:290px;max-width:430px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:12px 14px;font-size:1.1rem;border:3px solid var(--blk);background:#f3f3f3;color:#000;transform:skew(-6deg);outline:0;transition:.2s var(--bounce)}
.search input::placeholder{color:#000;opacity:.6}
.search input:focus{transform:skew(-6deg) scale(1.03);border-color:var(--red);box-shadow:5px 5px 0 var(--red)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;padding:6px 6px 18px;align-content:start;grid-auto-rows:max-content}
.card{background:var(--blk);color:var(--wht);padding:12px 12px 20px;text-align:left;transform:rotate(var(--r,0deg));transition:.25s var(--bounce);
 clip-path:polygon(0 0,100% 4%,100% 100%,6% 96%);animation:pop2 .35s var(--bounce) backwards;position:relative}
.card:nth-child(odd){--r:-1.5deg}.card:nth-child(even){--r:1.5deg}
.card::after{content:"";position:absolute;inset:0;background:var(--red);transform:translateX(-101%) skewX(-20deg);transition:.3s;z-index:0}
.card>*{position:relative;z-index:1}
.card:hover,.card:active{transform:scale(1.08) rotate(0);z-index:2}
.card:hover::after{transform:translateX(0) skewX(-20deg)}
.card .emo{font-size:2rem;display:block}
.thumb{display:block;width:100%;height:96px;object-fit:contain;background:#fff;margin-bottom:6px;transform:skew(-4deg);transition:.3s var(--bounce)}
.card:hover .thumb{transform:skew(-4deg) scale(1.06) rotate(-2deg)}
.ic{width:28px;height:28px;object-fit:contain;background:#fff;vertical-align:middle;margin-right:4px}
.card b{display:block;margin:4px 0 2px;font-size:.95rem}
.card .pr{display:block;font-family:"P5";font-size:1.25rem;color:#ffd7da}
.card:hover .pr{color:#fff}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;font-size:.82rem;font-weight:800;color:#fff;white-space:nowrap}
.card .meta span:first-child{overflow:hidden;text-overflow:ellipsis}
@keyframes pop2{from{opacity:0;transform:scale(.4) rotate(12deg)}}
.empty{grid-column:1/-1;text-align:center;font-family:"P5";font-size:1.6rem;color:var(--red);padding:30px}

/* Keranjang */
#cart{flex:1;overflow:auto;margin-bottom:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 6px;border-bottom:2px dashed #999;animation:slide .35s var(--bounce)}
.item .nm{font-weight:700}.item .sub{font-family:"P5";color:var(--red);font-size:1.2rem;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;background:var(--blk);color:#fff;font-size:1.1rem;transform:skew(-10deg);transition:.2s var(--bounce)}
.qty button:hover{background:var(--red);transform:skew(-10deg) scale(1.25)}
.qty .x{background:var(--red)}
.sum{background:var(--blk);color:#fff;padding:10px 12px;transform:skew(-3deg);margin:4px 0}
.sum div{display:flex;justify-content:space-between;font-size:.95rem;padding:2px 0}
.sum .tot{font-family:"P5";font-size:2.3rem;color:var(--red);background:#fff;margin:6px -12px -10px;padding:2px 12px;border-top:4px solid var(--red)}
.disc{display:flex;gap:6px;margin:8px 0}
.disc select,.disc input,.pay input{padding:8px;border:3px solid var(--blk);background:#f3f3f3;color:#000;min-width:0}
.disc input::placeholder,.pay input::placeholder{color:#000;opacity:.6}
.disc input,.pay input{flex:1}
.pay{display:flex;gap:6px;margin-bottom:6px}
.chg{font-family:"P5";font-size:1.4rem;margin-bottom:6px;min-height:1.6rem}
.chg.bad{color:var(--red)}
.btn{font-family:"P5";font-size:1.4rem;padding:10px 18px;background:var(--red);color:#fff;transform:skew(-10deg);transition:.25s var(--bounce);box-shadow:4px 4px 0 var(--blk)}
.btn:hover{transform:skew(-10deg) scale(1.08) rotate(-2deg);background:var(--blk);box-shadow:5px 5px 0 var(--red)}
.btn:active{transform:skew(-10deg) scale(.94)}
.btn.alt{background:var(--blk)}.btn.alt:hover{background:var(--red)}
.btn.wide{width:100%}
.row{display:flex;gap:8px}

/* ===== ADMIN ===== */
#adminForm{flex:1;max-width:360px}
#adminList{flex:2}
#adminForm label{font-family:"P5";font-size:1.15rem;margin-top:8px;display:block;color:var(--red)}
#adminForm input{width:100%;padding:10px;border:3px solid var(--blk);background:#f3f3f3;color:#000;margin-top:2px}
#adminForm input::placeholder{color:#000;opacity:.6}
#adminForm input::file-selector-button{color:#000}
#adminForm .row{margin-top:14px}
.prev{display:flex;align-items:center;gap:10px;margin-top:8px}
.prev img{width:72px;height:72px;object-fit:contain;background:#fff;border:3px solid var(--blk);transform:skew(-4deg)}
#adminForm.flash{animation:flash .6s var(--bounce)}
@keyframes flash{0%{transform:scale(.92) rotate(-2deg)}60%{transform:scale(1.04) rotate(1deg)}100%{transform:none}}
.tbl{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse}
th{font-family:"P5";background:var(--red);color:#fff;padding:8px;text-align:left;font-weight:normal;position:sticky;top:0}
td{padding:8px;border-bottom:2px solid #999;color:#000}
tr{animation:slide .3s var(--bounce) backwards}
tbody tr:hover{background:#ffe3e5}
.mini{padding:5px 10px;font-size:.85rem;background:var(--red);color:#fff;transform:skew(-10deg);transition:.2s var(--bounce)}
.mini:hover{transform:skew(-10deg) scale(1.2)}.mini.e{background:#fff;color:#000;border:2px solid #000}

/* ===== KALKULATOR (FAB + pop-up) ===== */
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:68px;height:68px;border-radius:50%;background:var(--red);color:#fff;font-size:1.9rem;border:4px solid #fff;box-shadow:0 0 0 4px var(--blk);transition:.3s var(--bounce)}
#fab:hover{transform:scale(1.2) rotate(-15deg)}
#calc{position:fixed;right:16px;bottom:96px;z-index:21;width:280px;max-width:calc(100vw - 32px);background:var(--blk);border:4px solid var(--red);padding:12px;transform:scale(0) rotate(-20deg);transform-origin:bottom right;transition:.4s var(--bounce);box-shadow:8px 8px 0 #fff}
#calc.on{transform:scale(1) rotate(0)}
#cd{background:#fff;color:#000;font-family:"P5";font-size:2rem;text-align:right;padding:6px 10px;margin-bottom:8px;overflow:hidden;min-height:50px;transform:skew(-4deg)}
#ch{font-size:.75rem;color:#999;min-height:1em;text-align:right}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{padding:14px 0;background:#fff;color:#000;font-family:"P5";font-size:1.3rem;transform:skew(-8deg);transition:.2s var(--bounce)}
.keys button:hover{transform:skew(-8deg) scale(1.15);background:var(--red);color:#fff}
.keys .o{background:var(--red);color:#fff}.keys .eq{background:#ffd400;color:#000}

/* Toast */
#toast{position:fixed;top:84px;left:50%;transform:translate(-50%,-300%) rotate(-3deg);opacity:0;visibility:hidden;pointer-events:none;background:#fff;color:#000;font-family:"P5";font-size:1.6rem;padding:8px 26px;border:4px solid var(--red);z-index:30;transition:transform .45s var(--bounce),opacity .3s,visibility .45s}
#toast.on{transform:translate(-50%,0) rotate(-3deg);opacity:1;visibility:visible}

/* ===== RESPONSIF (tablet / HP) ===== */
@media (max-width:860px){
 body{overflow:auto}#app{height:auto;min-height:100%}
 .view.on{flex-direction:column}
 #cartP,#adminForm{max-width:none}
 #products{min-height:60vh}.grid{max-height:55vh}
 #cart{max-height:30vh}
 .panel{overflow:visible}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1 class="p5">JOEN</h1>
  <nav>
   <button class="tab p5 on" data-v="kasir">Kasir</button>

const pic=p=>p.img==="none"?"":(p.img||IMG[p.id]); // gambar custom (p.img) atau gambar bawaan
let products=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(seed))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(products))}catch(e){}}
let cart={}; // {id: qty}
const $=s=>document.querySelector(s), rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}

/* ===== Helper angka: "78.600" dibaca 78600 (titik = pemisah ribuan, bukan desimal) ===== */
const digits=v=>+String(v).replace(/\D/g,"")||0;
const thousand=el=>{const d=el.value.replace(/\D/g,"");el.value=d?(+d).toLocaleString("id-ID"):""}; // format otomatis 78.600
function parseDisc(){const v=$("#dVal").value;return $("#dType").value==="pct"?(parseFloat(v.replace(",","."))||0):digits(v)}

/* ============ NAVIGASI ============ */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab,.view").forEach(x=>x.classList.remove("on"));
 b.classList.add("on");$("#"+b.dataset.v).classList.add("on");
 b.dataset.v==="admin"?renderAdmin():renderGrid();});

/* ============ KASIR: LIVE SEARCH + GRID ============ */
function renderGrid(){
 const q=$("#q").value.toLowerCase().trim();
 const list=products.filter(p=>(p.name+" "+p.cat).toLowerCase().includes(q));
 $("#grid").innerHTML=list.length?list.map((p,i)=>`<button class="card" style="animation-delay:${i*40}ms" data-id="${p.id}" ${p.stock<=0?"disabled":""}>
  ${pic(p)?`<img class="thumb" src="${pic(p)}" alt="${esc(p.name)}">`:`<span class="emo">${esc(p.emo||"📦")}</span>`}<b>${esc(p.name)}</b><span class="pr">${rp(p.price)}</span><span class="meta"><span>${esc(p.cat)}</span><span>stok ${p.stock}</span></span></button>`).join("")
  :`<div class="empty">Tidak ketemu, Joker!</div>`;
}
$("#q").oninput=renderGrid; // real-time
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)add(+c.dataset.id)};

/* ============ KERANJANG ============ */
function add(id){const p=products.find(x=>x.id===id);if(!p)return;
 if((cart[id]||0)>=p.stock)return toast("Stok habis!");cart[id]=(cart[id]||0)+1;renderCart()}
function renderCart(){
 const ids=Object.keys(cart).map(Number);
 $("#cart").innerHTML=ids.length?ids.map(id=>{const p=products.find(x=>x.id===id);return `<div class="item">
  <span class="nm">${pic(p)?`<img class="ic" src="${pic(p)}" alt="">`:esc(p.emo||"")} ${esc(p.name)}</span><span class="sub">${rp(p.price*cart[id])}</span>
  <div class="qty"><button data-a="-" data-id="${id}">−</button><b>${cart[id]}</b><button data-a="+" data-id="${id}">+</button><button class="x" data-a="x" data-id="${id}">✕</button></div></div>`}).join("")
  :`<div class="empty" style="font-size:1.2rem;padding:16px">Keranjang kosong</div>`;
 totals();}
$("#cart").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=+b.dataset.id,a=b.dataset.a;
 if(a==="+")add(id);else if(a==="-"){if(--cart[id]<=0)delete cart[id];renderCart()}else{delete cart[id];renderCart()}};

/* ============ TOTAL + DISKON (% atau nominal) ============ */
let total=0;
function totals(){
 const sub=Object.keys(cart).reduce((s,id)=>s+products.find(p=>p.id==id).price*cart[id],0);
 let d=Math.max(0,parseDisc());
 d=$("#dType").value==="pct"?sub*Math.min(d,100)/100:Math.min(d,sub);
 total=sub-d;
 $("#sum").innerHTML=`<div><span>Subtotal</span><span>${rp(sub)}</span></div><div><span>Diskon</span><span>- ${rp(d)}</span></div><div class="tot p5"><span>TOTAL</span> ${rp(total)}</div>`;
 change();}
function change(){const paid=digits($("#paid").value),c=$("#chg");
 if(!paid){c.textContent="";return}
 c.className="chg p5"+(paid<total?" bad":"");c.textContent=paid<total?"Kurang "+rp(total-paid):"Kembali "+rp(paid-total)}
$("#dType").oninput=()=>{const e=$("#dVal");e.value=$("#dType").value==="nom"?e.value.replace(/\D/g,""):e.value.replace(/\./g,"");if($("#dType").value==="nom")thousand(e);totals()};
$("#dVal").oninput=e=>{if($("#dType").value==="nom")thousand(e.target);else e.target.value=e.target.value.replace(/[^\d.,]/g,"");totals()};
$("#paid").oninput=e=>{thousand(e.target);change()};
function reset(){cart={};$("#dVal").value="";$("#paid").value="";renderCart()}
$("#clrBtn").onclick=reset;
$("#payBtn").onclick=()=>{
 if(!Object.keys(cart).length)return toast("Keranjang kosong!");
 const paid=digits($("#paid").value);if(paid<total)return toast("Uang kurang!");
 for(const id in cart){const p=products.find(x=>x.id==id);p.stock-=cart[id]}
 save();const k=paid-total;reset();renderGrid();toast("TAKE YOUR TIME! Kembali "+rp(k))};

/* ============ ADMIN CRUD ============ */
function renderAdmin(){
 $("#tb").innerHTML=products.map(p=>`<tr><td>${pic(p)?`<img class="ic" src="${pic(p)}" alt="">`:"—"}</td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${rp(p.price)}</td><td>${p.stock}</td>
 <td><button class="mini e" data-a="e" data-id="${p.id}">Edit</button> <button class="mini" data-a="d" data-id="${p.id}">Hapus</button></td></tr>`).join("")}
let fImg=null; // gambar form: dataURL baru | "none" = hapus | null = tidak berubah
function setPrev(src){const i=$("#fPrev");i.hidden=!src;$("#fDelImg").hidden=!src;if(src)i.src=src}
function clearForm(){["fId","fName","fCat","fPrice","fStock","fFile"].forEach(i=>$("#"+i).value="");fImg=null;setPrev("");$("#fTitle").textContent="Tambah Produk"}
// Upload gambar -> dikecilkan ke 220px (kotak, latar putih) agar ringan di localStorage
$("#fFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=220;const x=c.getContext("2d");
   x.fillStyle="#fff";x.fillRect(0,0,220,220);const k=Math.min(220/im.width,220/im.height),w=im.width*k,h=im.height*k;
   x.drawImage(im,(220-w)/2,(220-h)/2,w,h);fImg=c.toDataURL("image/jpeg",.82);setPrev(fImg)};
  im.onerror=()=>toast("Gambar tidak valid");im.src=r.result};
 r.readAsDataURL(f)};
$("#fDelImg").onclick=()=>{fImg="none";setPrev("");$("#fFile").value=""};
$("#fSave").onclick=()=>{ // Create & Update
 const name=$("#fName").value.trim(),pv=$("#fPrice").value;
 if(!name||pv==="")return toast("Isi nama & harga!");
 const data={name,cat:$("#fCat").value.trim()||"Umum",price:digits(pv),stock:+$("#fStock").value||0},id=+$("#fId").value;
 if(fImg!==null)data.img=fImg;
 if(id){const p=products.find(x=>x.id===id);if(p)Object.assign(p,data)}else products.push({id:Date.now(),...data});
 save();clearForm();renderAdmin();renderGrid();renderCart();toast(id?"Diperbarui!":"Ditambahkan!")};
$("#fCancel").onclick=clearForm;
$("#fPrice").oninput=e=>thousand(e.target);
let delArm=null;
$("#tb").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=+b.dataset.id;
 if(b.dataset.a==="d"){ // hapus: konfirmasi 2 klik (confirm() sering diblokir di iframe)
  if(delArm!==id){delArm=id;b.textContent="Yakin?";setTimeout(()=>{if(delArm===id){delArm=null;b.textContent="Hapus"}},2500);return}
  delArm=null;products=products.filter(p=>p.id!==id);delete cart[id];save();renderAdmin();renderGrid();renderCart();toast("Dihapus!")}
 else{ // EDIT: isi form, lalu gulir + fokus supaya jelas terlihat
  const p=products.find(x=>x.id===id);if(!p)return;
  $("#fId").value=id;$("#fName").value=p.name;$("#fCat").value=p.cat;$("#fPrice").value=p.price.toLocaleString("id-ID");$("#fStock").value=p.stock;
  $("#fFile").value="";fImg=null;setPrev(pic(p));$("#fTitle").textContent="Edit: "+p.name;
  const f=$("#adminForm");f.scrollIntoView({behavior:"smooth",block:"start"});
  f.classList.remove("flash");void f.offsetWidth;f.classList.add("flash");
  $("#fName").focus({preventScroll:true});toast("Mode edit")}};

/* ============ KALKULATOR ============ */
const kk=["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0","00",".","="];
$("#keys").innerHTML=kk.map(k=>`<button class="${"÷×−+%".includes(k)?"o":k==="="?"eq":""}">${k}</button>`).join("");
let ex="";
const show=()=>$("#cd").textContent=ex||"0";
$("#fab").onclick=()=>$("#calc").classList.toggle("on");
$("#keys").onclick=e=>{const k=e.target.textContent;if(e.target.tagName!=="BUTTON")return;
 if(k==="C"){ex="";$("#ch").textContent=""}
 else if(k==="⌫")ex=ex.slice(0,-1);
 else if(k==="="){try{const r=Function('"use strict";return ('+ex.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100")+')')();
   $("#ch").textContent=ex+" =";ex=String(+(+r).toFixed(6))}catch(_){ex="Error"}}
 else{if(ex==="Error")ex="";ex+=k}
 show()};

renderGrid();renderCart();
</script>
</body>
</html>
